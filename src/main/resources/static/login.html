<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📚 Student Management System</h1>
    </div>
    <div class="main">
        <div class="login-card">
            <h2>🔐 Welcome Back</h2>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <button id="loginBtn" style="width: 100%;">Sign In</button>
            <div id="errorMsg" class="error-msg" style="display: none;"></div>
            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e9ecef;">
                <p style="text-align: center; color: #6c757d; font-size: 0.85rem; margin-bottom: 10px;">
                    <strong>Demo Accounts:</strong>
                </p>
                <p style="font-size: 0.8rem; text-align: center;">
                    📧 admin@example.com / admin123<br>
                    📧 teacher@example.com / teacher123<br>
                    📧 student@example.com / student123
                </p>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMsg');

        if (!email || !password) {
            errorDiv.style.display = 'block';
            errorDiv.textContent = 'Please enter email and password';
            return;
        }

        try {
            const response = await fetch('/api/admin/users', {
                headers: { 'Authorization': 'Basic ' + btoa(`${email}:${password}`) }
            });
            if (!response.ok) throw new Error('Invalid credentials');

            const users = await response.json();
            const currentUser = users.find(u => u.email === email);
            if (!currentUser) throw new Error('User not found');

            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPassword', password);
            localStorage.setItem('userRole', currentUser.Role);
            localStorage.setItem('userName', currentUser.name);

            if (currentUser.role === 'ADMIN') window.location.href = '/admin.html';
            else if (currentUser.role === 'TEACHER') window.location.href = '/teacher.html';
            else window.location.href = '/student.html';
        } catch (err) {
            errorDiv.style.display = 'block';
            errorDiv.textContent = err.message;
        }
    });

    document.getElementById('email').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
</script>
</body>
</html>
