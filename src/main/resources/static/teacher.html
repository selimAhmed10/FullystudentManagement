<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Student Management</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/api.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>👨‍🏫 Teacher Dashboard</h1>
        <div class="user-panel">
            <span>👋 Welcome, <span id="userName"></span></span>
            <span class="user-role" id="userRole"></span>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </div>
    <div class="main">
        <!-- Students List -->
        <div class="card">
            <h3>📖 All Students</h3>
            <div id="studentsList"></div>
        </div>

        <!-- My Courses -->
        <div class="card">
            <h3>📚 My Courses</h3>
            <div id="myCoursesList"></div>
        </div>

        <!-- Assignments Management -->
        <div class="card">
            <h3>📝 Assignments</h3>
            <button class="action-btn add-btn" id="showAssignmentFormBtn">➕ Create Assignment</button>
            <div id="assignmentsList"></div>
            <div id="assignmentFormContainer" style="display: none;">
                <form id="assignmentForm">
                    <h4>Create New Assignment</h4>
                    <div class="form-row">
                        <div class="input-group">
                            <label>Course ID</label>
                            <input type="number" id="assignmentCourseId" required>
                        </div>
                        <div class="input-group">
                            <label>Title</label>
                            <input type="text" id="assignmentTitle" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label>Due Date</label>
                            <input type="datetime-local" id="assignmentDueDate">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Description</label>
                        <textarea id="assignmentDescription" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <button type="submit">💾 Save Assignment</button>
                        <button type="button" id="cancelAssignmentFormBtn" class="btn-danger">❌ Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Submissions Grading -->
        <div class="card">
            <h3>📋 Grade Submissions</h3>
            <div class="form-row">
                <div class="input-group">
                    <label>Assignment ID</label>
                    <input type="number" id="viewSubmissionsAssignmentId" placeholder="Enter Assignment ID">
                </div>
                <button id="loadSubmissionsBtn">📊 Load Submissions</button>
            </div>
            <div id="submissionsList"></div>
        </div>
    </div>
</div>
<script>
    let editingAssignmentId = null;

    // Load all students
    async function loadStudents() {
        try {
            const students = await apiRequest('/api/teacher/students', 'GET');
            const container = document.getElementById('studentsList');
            if (!students || students.length === 0) {
                container.innerHTML = '<p style="text-align: center;">No students found.</p>';
                return;
            }
            let html = `<table>
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Email</th><th>Grade Level</th>
                    </tr>
                </thead>
                <tbody>`;
            students.forEach(s => {
                html += `<tr>
                    <td data-label="ID">${s.id}</td>
                    <td data-label="Name">${s.name}</td>
                    <td data-label="Email">${s.email}</td>
                    <td data-label="Grade Level">${s.studentGradeLevel || '-'}</td>
                </tr>`;
            });
            html += '</tbody></tr>';
            container.innerHTML = html;
        } catch (error) {
            showError('studentsList', error.message);
        }
    }

    // Load my courses
    async function loadMyCourses() {
        try {
            const courses = await apiRequest('/api/teacher/courses', 'GET');
            const container = document.getElementById('myCoursesList');
            if (!courses || courses.length === 0) {
                container.innerHTML = '<p style="text-align: center;">No courses assigned.</p>';
                return;
            }
            let html = `<table>
                <thead>
                    <tr>
                        <th>ID</th><th>Course Name</th><th>Schedule</th><th>Fee</th>
                    </tr>
                </thead>
                <tbody>`;
            courses.forEach(c => {
                html += `<tr>
                    <td data-label="ID">${c.id}</td>
                    <td data-label="Course Name">${c.name}</td>
                    <td data-label="Schedule">${c.schedule || '-'}</td>
                    <td data-label="Fee">$${c.fee}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (error) {
            showError('myCoursesList', error.message);
        }
    }

    // Load assignments
    async function loadAssignments() {
        try {
            const courses = await apiRequest('/api/teacher/courses', 'GET');
            if (courses.length === 0) {
                document.getElementById('assignmentsList').innerHTML = '<p style="text-align: center;">No courses found.</p>';
                return;
            }
            const assignments = await apiRequest(`/api/teacher/assignments/course/${courses[0].id}`, 'GET');
            const container = document.getElementById('assignmentsList');
            if (!assignments || assignments.length === 0) {
                container.innerHTML = '<p style="text-align: center;">No assignments created yet.</p>';
                return;
            }
            let html = `<table>
                <thead>
                    <tr>
                        <th>ID</th><th>Title</th><th>Course ID</th><th>Due Date</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody>`;
            assignments.forEach(a => {
                html += `<tr>
                    <td data-label="ID">${a.id}</td>
                    <td data-label="Title">${a.title}</td>
                    <td data-label="Course ID">${a.course.id}</td>
                    <td data-label="Due Date">${a.dueDate ? new Date(a.dueDate).toLocaleString() : '-'}</td>
                    <td data-label="Actions">
                        <button class="action-btn edit-btn" onclick="editAssignment(${a.id})">✏️ Edit</button>
                        <button class="action-btn delete-btn" onclick="deleteAssignment(${a.id})">🗑️ Delete</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (error) {
            showError('assignmentsList', error.message);
        }
    }

    // Edit assignment
    async function editAssignment(id) {
        const courses = await apiRequest('/api/teacher/courses', 'GET');
        if (courses.length === 0) return;
        const assignments = await apiRequest(`/api/teacher/assignments/course/${courses[0].id}`, 'GET');
        const assignment = assignments.find(a => a.id === id);
        if (!assignment) return;
        editingAssignmentId = id;
        document.getElementById('assignmentCourseId').value = assignment.course.id;
        document.getElementById('assignmentTitle').value = assignment.title;
        document.getElementById('assignmentDescription').value = assignment.description || '';
        document.getElementById('assignmentDueDate').value = assignment.dueDate ? assignment.dueDate.slice(0, 16) : '';
        document.getElementById('assignmentFormContainer').style.display = 'block';
        document.getElementById('showAssignmentFormBtn').style.display = 'none';
    }

    // Delete assignment
    async function deleteAssignment(id) {
        if (!confirm('Are you sure you want to delete this assignment?')) return;
        try {
            await apiRequest(`/api/teacher/assignments/${id}`, 'DELETE');
            loadAssignments();
            showSuccess('assignmentsList', 'Assignment deleted successfully');
        } catch (error) {
            alert(error.message);
        }
    }

    // Load submissions for grading
    document.getElementById('loadSubmissionsBtn').addEventListener('click', async () => {
        const assignmentId = document.getElementById('viewSubmissionsAssignmentId').value;
        if (!assignmentId) {
            alert('Please enter Assignment ID');
            return;
        }
        try {
            const submissions = await apiRequest(`/api/teacher/submissions/assignment/${assignmentId}`, 'GET');
            const container = document.getElementById('submissionsList');
            if (!submissions || submissions.length === 0) {
                container.innerHTML = '<p style="text-align: center;">No submissions found.</p>';
                return;
            }
            let html = `<table>
                <thead>
                    <tr>
                        <th>ID</th><th>Student</th><th>Answer</th><th>Grade</th><th>Feedback</th><th>Action</th>
                    </tr>
                </thead>
                <tbody>`;
            submissions.forEach(s => {
                html += `<tr>
                    <td data-label="ID">${s.id}</td>
                    <td data-label="Student">${s.student.name}</td>
                    <td data-label="Answer">${s.answerText}</td>
                    <td data-label="Grade">
                        <input type="number" id="grade_${s.id}" value="${s.grade !== null ? s.grade : ''}" placeholder="0-100" style="width: 80px;">
                    </td>
                    <td data-label="Feedback">
                        <input type="text" id="feedback_${s.id}" value="${s.feedback || ''}" placeholder="Feedback" style="width: 150px;">
                    </td>
                    <td data-label="Action">
                        <button class="action-btn edit-btn" onclick="gradeSubmission(${s.id})">💾 Save Grade</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (error) {
            showError('submissionsList', error.message);
        }
    });

    // Grade submission
    window.gradeSubmission = async (submissionId) => {
        const grade = document.getElementById(`grade_${submissionId}`).value;
        const feedback = document.getElementById(`feedback_${submissionId}`).value;
        if (!grade) {
            alert('Please enter a grade');
            return;
        }
        try {
            await apiRequest(`/api/teacher/submissions/${submissionId}/grade?grade=${grade}&feedback=${encodeURIComponent(feedback)}`, 'PUT');
            alert('✅ Grade saved successfully!');
            document.getElementById('loadSubmissionsBtn').click();
        } catch (error) {
            alert(error.message);
        }
    };

    // Event Listeners
    document.getElementById('showAssignmentFormBtn').addEventListener('click', () => {
        editingAssignmentId = null;
        document.getElementById('assignmentForm').reset();
        document.getElementById('assignmentFormContainer').style.display = 'block';
        document.getElementById('showAssignmentFormBtn').style.display = 'none';
    });

    document.getElementById('cancelAssignmentFormBtn').addEventListener('click', () => {
        document.getElementById('assignmentFormContainer').style.display = 'none';
        document.getElementById('showAssignmentFormBtn').style.display = 'inline-block';
    });

    document.getElementById('assignmentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const assignmentData = {
            title: document.getElementById('assignmentTitle').value,
            description: document.getElementById('assignmentDescription').value,
            dueDate: document.getElementById('assignmentDueDate').value,
            course: { id: parseInt(document.getElementById('assignmentCourseId').value) }
        };
        try {
            if (editingAssignmentId) {
                await apiRequest(`/api/teacher/assignments/${editingAssignmentId}`, 'PUT', assignmentData);
            } else {
                await apiRequest('/api/teacher/assignments', 'POST', assignmentData);
            }
            loadAssignments();
            document.getElementById('cancelAssignmentFormBtn').click();
            showSuccess('assignmentsList', 'Assignment saved successfully');
        } catch (error) {
            alert(error.message);
        }
    });

    // Initialize
    window.onload = () => {
        const userInfo = checkAuth();
        if (userInfo && userInfo.role !== 'TEACHER') {
            alert('Access denied. Teachers only.');
            logout();
            return;
        }
        document.getElementById('userName').innerText = localStorage.getItem('userName') || '';
        document.getElementById('userRole').innerText = userInfo.role;
        loadStudents();
        loadMyCourses();
        loadAssignments();
    };
</script>
</body>
</html>
